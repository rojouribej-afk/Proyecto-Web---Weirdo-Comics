<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weirdo Comics - Login</title>
</head>
<link rel="stylesheet" href="estilos.css">
<body>

  <main class="tarjeta">
    <form class="login">
      <h1>WEIRDO COMICS</h1>
      <p class="subtitulo">Sistema de Gestión</p>

      <div class="campo">
        <label for="correo">Correo Electrónico</label>
        <input type="email" id="correo" placeholder="usuario@example.com">
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••">
      </div>

      <button type="submit" class="btn"> <a href="Dashboard.html">Iniciar Sesión</a></button>

      <p class="recuperar">¿Olvidaste tu contraseña? <a href="#">Recuperar</a></p>
    </form>
  </main>

</body>
</html>
